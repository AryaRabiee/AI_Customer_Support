<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - دستیار مشتری هوشمند</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #2a4f7f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(30, 58, 95, 0.2);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .form-section {
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .image-section {
            background: linear-gradient(135deg, #1e3a5f 0%, #2a4f7f 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
            position: relative;
            overflow: hidden;
        }

        .image-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .image-section h2 {
            font-size: 2.1em;
            margin-bottom: 25px;
            text-align: center;
            position: relative;
            z-index: 1;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .image-icon {
            font-size: 5em;
            margin-bottom: 25px;
            animation: float 3s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .image-section p {
            font-size: 1.05em;
            text-align: center;
            opacity: 0.9;
            line-height: 1.8;
            position: relative;
            z-index: 1;
            max-width: 350px;
        }

        .logo {
            font-size: 1.6em;
            font-weight: 700;
            color: #1e3a5f;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 40px;
            border-bottom: 2px solid #e8e8e8;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 20px;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-weight: 600;
            font-size: 0.95em;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            letter-spacing: 0.3px;
        }

        .tab-btn.active {
            color: #1e3a5f;
            border-bottom-color: #1e3a5f;
        }

        .tab-btn:hover {
            color: #1e3a5f;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #1e3a5f;
            font-weight: 600;
            font-size: 0.95em;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 0.95em;
            transition: all 0.3s;
            background: #f9f9f9;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1e3a5f;
            background: white;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.08);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3a5f 0%, #2a4f7f 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            letter-spacing: 0.3px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 58, 95, 0.25);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .message {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: none;
            font-size: 0.95em;
            font-weight: 500;
            border-left: 4px solid;
        }

        .message.active {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: #e8f5e9;
            color: #1b5e20;
            border-left-color: #4caf50;
        }

        .message.error {
            background: #ffebee;
            color: #b71c1c;
            border-left-color: #f44336;
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #1e3a5f;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .back-link a:hover {
            color: #2a4f7f;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .image-section {
                display: none;
            }

            .form-section {
                padding: 40px 30px;
            }

            .logo {
                font-size: 1.4em;
                margin-bottom: 30px;
            }

            .tabs {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Form Section -->
        <div class="form-section">
            <div class="logo">🤖 دستیار مشتری</div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">ورود</button>
                <button class="tab-btn" onclick="switchTab('signup')">ثبت نام</button>
            </div>

            <!-- Login Tab -->
            <div id="login" class="tab-content active">
                <div class="message" id="loginMsg"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">ایمیل</label>
                        <input type="email" id="loginEmail" required placeholder="ایمیل خود را وارد کنید">
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">رمز عبور</label>
                        <input type="password" id="loginPassword" required placeholder="رمز عبور خود را وارد کنید">
                    </div>

                    <button type="submit" class="submit-btn">ورود</button>
                </form>
            </div>

            <!-- Signup Tab -->
            <div id="signup" class="tab-content">
                <div class="message" id="signupMsg"></div>
                <form id="signupForm">
                    <div class="form-group">
                        <label for="signupName">نام کامل</label>
                        <input type="text" id="signupName" required placeholder="نام خود را وارد کنید">
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">ایمیل</label>
                        <input type="email" id="signupEmail" required placeholder="ایمیل خود را وارد کنید">
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">رمز عبور</label>
                        <input type="password" id="signupPassword" required placeholder="رمز عبور را انتخاب کنید" minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="signupConfirm">تکرار رمز عبور</label>
                        <input type="password" id="signupConfirm" required placeholder="رمز عبور را دوباره وارد کنید" minlength="6">
                    </div>

                    <button type="submit" class="submit-btn">ثبت نام</button>
                </form>
            </div>

            <div class="back-link">
                <a href="/">← بازگشت به خانه</a>
            </div>
        </div>

        <!-- Image Section -->
        <div class="image-section">
            <div class="image-icon">🚀</div>
            <h2>خوش آمدید!</h2>
            <p>
                سیستم هوشمند دستیار مشتری شما را برای ارائه‌ی بهترین خدمات منتظر است
            </p>
        </div>
    </div>

<script>
    // =========================
    // Tab Switching
    // =========================
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        document.getElementById(tabName).classList.add('active');

        event.target.classList.add('active');
    }


    // =========================
    // Show Message
    // =========================
    function showMessage(elementId, text, type) {
        const element = document.getElementById(elementId);

        element.textContent = text;
        element.className = `message ${type} active`;

        setTimeout(() => {
            element.classList.remove('active');
        }, 4000);
    }


    // =========================
    // Refresh Access Token
    // =========================
    async function refreshAccessToken() {

        try {
            const response = await fetch('/api/auth/refresh', {
                method: 'POST',
                credentials: 'include'
            });

            return response.ok;

        } catch (error) {
            console.error('Refresh token error:', error);
            return false;
        }
    }


    // =========================
    // API Request Helper
    // =========================
    async function apiFetch(url, options = {}) {

        let response = await fetch(url, {
            ...options,
            credentials: 'include'
        });


        // Access Token expired
        if (response.status === 401) {

            const refreshed = await refreshAccessToken();

            // Refresh failed
            if (!refreshed) {
                window.location.href = '/login';
                return response;
            }


            // Access Token successfully refreshed
            // Try original request again
            response = await fetch(url, {
                ...options,
                credentials: 'include'
            });
        }

        return response;
    }


    // =========================
    // Login Form
    // =========================
    document.getElementById('loginForm').addEventListener('submit', async (e) => {

        e.preventDefault();

        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {

            const response = await fetch('/api/auth/login', {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                credentials: 'include',

                body: JSON.stringify({
                    email,
                    password
                })
            });


            if (response.ok) {

                showMessage(
                    'loginMsg',
                    '✓ ورود موفق! درحال انتقال...',
                    'success'
                );

                setTimeout(() => {
                    window.location.href = '/support';
                }, 1500);

            } else {

                const error = await response.json();

                showMessage(
                    'loginMsg',
                    '❌ ' + (error.detail || 'خطا در ورود'),
                    'error'
                );
            }

        } catch (error) {

            console.error(error);

            showMessage(
                'loginMsg',
                '❌ خطا در اتصال به سرور',
                'error'
            );
        }
    });


    // =========================
    // Signup Form
    // =========================
    document.getElementById('signupForm').addEventListener('submit', async (e) => {

        e.preventDefault();

        const name = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const confirm = document.getElementById('signupConfirm').value;


        if (password !== confirm) {

            showMessage(
                'signupMsg',
                '❌ رمز عبور‌ها مطابقت ندارند',
                'error'
            );

            return;
        }


        try {

            const response = await fetch('/api/auth/signup', {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    name,
                    email,
                    password
                })
            });


            if (response.ok) {

                showMessage(
                    'signupMsg',
                    '✓ ثبت‌نام موفق! لطفاً وارد شوید',
                    'success'
                );

                setTimeout(() => {

                    switchTab('login');

                    document.getElementById('loginEmail').value = email;

                }, 1500);

            } else {

                const error = await response.json();

                showMessage(
                    'signupMsg',
                    '❌ ' + (error.detail || 'خطا در ثبت‌نام'),
                    'error'
                );
            }

        } catch (error) {

            console.error(error);

            showMessage(
                'signupMsg',
                '❌ خطا در اتصال به سرور',
                'error'
            );
        }
    });
</script>
</body>
</html>
