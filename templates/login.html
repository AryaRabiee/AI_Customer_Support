<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - دستیار مشتری هوشمند</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .form-section {
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .image-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
        }

        .image-section h2 {
            font-size: 2em;
            margin-bottom: 20px;
            text-align: center;
        }

        .image-icon {
            font-size: 6em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .image-section p {
            font-size: 1.1em;
            text-align: center;
            opacity: 0.9;
            line-height: 1.8;
        }

        .logo {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-weight: bold;
            font-size: 1em;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.active {
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .image-section {
                display: none;
            }

            .form-section {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Form Section -->
        <div class="form-section">
            <div class="logo">🤖 Smart Support</div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">ورود</button>
                <button class="tab-btn" onclick="switchTab('signup')">ثبت نام</button>
            </div>

            <!-- Login Tab -->
            <div id="login" class="tab-content active">
                <div class="message" id="loginMsg"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">ایمیل</label>
                        <input type="email" id="loginEmail" required placeholder="ایمیل خود را وارد کنید">
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">رمز عبور</label>
                        <input type="password" id="loginPassword" required placeholder="رمز عبور خود را وارد کنید">
                    </div>

                    <button type="submit" class="submit-btn">ورود</button>
                </form>
            </div>

            <!-- Signup Tab -->
            <div id="signup" class="tab-content">
                <div class="message" id="signupMsg"></div>
                <form id="signupForm">
                    <div class="form-group">
                        <label for="signupName">نام کامل</label>
                        <input type="text" id="signupName" required placeholder="نام خود را وارد کنید">
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">ایمیل</label>
                        <input type="email" id="signupEmail" required placeholder="ایمیل خود را وارد کنید">
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">رمز عبور</label>
                        <input type="password" id="signupPassword" required placeholder="رمز عبور را انتخاب کنید" minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="signupConfirm">تکرار رمز عبور</label>
                        <input type="password" id="signupConfirm" required placeholder="رمز عبور را دوباره وارد کنید" minlength="6">
                    </div>

                    <button type="submit" class="submit-btn">ثبت نام</button>
                </form>
            </div>

            <div class="back-link">
                <a href="/">← بازگشت به خانه</a>
            </div>
        </div>

        <!-- Image Section -->
        <div class="image-section">
            <div class="image-icon">🚀</div>
            <h2>خوش آمدید!</h2>
            <p>
                سیستم هوشمند دستیار مشتری شما را برای ارائه‌ی بهترین خدمات منتظر است
            </p>
        </div>
    </div>

    <script>
        // Tab Switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // Show Message
        function showMessage(elementId, text, type) {
            const element = document.getElementById(elementId);
            element.textContent = text;
            element.className = `message ${type} active`;
            setTimeout(() => {
                element.classList.remove('active');
            }, 4000);
        }

        // Login Form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    showMessage('loginMsg', '✓ ورود موفق! درحال انتقال...', 'success');
                    setTimeout(() => {
                        window.location.href = '/test';
                    }, 1500);
                } else {
                    const error = await response.json();
                    showMessage('loginMsg', '❌ ' + (error.detail || 'خطا در ورود'), 'error');
                }
            } catch (error) {
                console.error(error);
                showMessage('loginMsg', '❌ خطا در اتصال به سرور', 'error');
            }
        });

        // Signup Form
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;

            if (password !== confirm) {
                showMessage('signupMsg', '❌ رمز عبور‌ها مطابقت ندارند', 'error');
                return;
            }

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                if (response.ok) {
                    showMessage('signupMsg', '✓ ثبت‌نام موفق! الطفا وارد شوید', 'success');
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('loginEmail').value = email;
                    }, 1500);
                } else {
                    const error = await response.json();
                    showMessage('signupMsg', '❌ ' + (error.detail || 'خطا در ثبت‌نام'), 'error');
                }
            } catch (error) {
                console.error(error);
                showMessage('signupMsg', '❌ خطا در اتصال به سرور', 'error');
            }
        });
    </script>
</body>
</html>
